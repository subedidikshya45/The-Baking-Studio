<!DOCTYPE html>
<html>
<head>
    <title>Sugar Bloom Bakery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #f8d7da;
            padding: 50px 20px;
        }

        h1 {
            color: #6b3e26;
            margin: 0;
        }

        .tagline {
            color: #555;
            font-size: 18px;
        }

        .section {
            padding: 30px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 180px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        footer {
            background-color: #f8d7da;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍰 Sugar Bloom Bakery</h1>
        <p class="tagline">Fresh bakes, sweet moments, and happiness in every bite.</p>
    </div>

    <div class="section">
        <h2>Our Favorites</h2>

        <div class="products">
            <div class="product">
                <h3>🎂 Cakes</h3>
                <p>Custom cakes for every occasion.</p>
            </div>

            <div class="product">
                <h3>🧁 Cupcakes</h3>
                <p>Soft, sweet, and delicious.</p>
            </div>

            <div class="product">
                <h3>🥐 Pastries</h3>
                <p>Freshly baked every day.</p>
            </div>
        </div>
    </div>

    <footer>
        Contact us for orders and special events.
    </footer>

</body>
</html>
